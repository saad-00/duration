<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حاسبة المدة التنفيذية</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a1622">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header class="top">
    <img src="logos/operator.svg" alt="" onerror="this.style.display='none'">
    <img src="logos/parent.svg" alt="" onerror="this.style.display='none'">
  </header>
  <h1>حاسبة المدة التنفيذية</h1>

  <section class="card">
    <div class="sb">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="ابحث عن خدمة أو شكوى أو بلاغ" aria-label="بحث" autocomplete="off">
      <button type="button" id="clear" aria-label="مسح" hidden>×</button>
    </div>
    <div class="pills" id="types"></div>

    <div id="pick">
      <div id="recent" class="recent" hidden></div>
      <div class="k count" id="count"></div>
      <ul id="results" class="results"></ul>
    </div>

    <div id="work" hidden>
      <div class="k lbl">المرحلة</div>
      <div class="stages" id="stages"></div>
      <label class="k lbl" for="start">بداية المرحلة</label>
      <input type="datetime-local" id="start" class="f">
      <p class="k info" id="info"></p>
      <hr>
      <div id="result"></div>
    </div>
  </section>

  <button type="button" id="install" class="install" hidden>تثبيت التطبيق على الجوال</button>
  <p class="clock" id="clock"></p>
<a class="feedback" href="https://docs.google.com/forms/d/e/1FAIpQLSd26ed9z0VTNy-c_ys7208fsW-wtzXhLPqNf1Qoz-BTziLDcQ/viewform?usp=publish-editor" target="_blank" rel="noopener">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/><path d="M9 10h6"/></svg>
  <span><b>لاحظت مدة غير صحيحة؟</b><small>أخبرنا لنصحّحها</small></span>
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
</a>  <p class="clock" id="ios" hidden>للتثبيت على الآيفون: زر المشاركة ثم «إضافة إلى الشاشة الرئيسية».</p>
</main>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
